<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - LE ROSÈA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-shop">

<div id="site-header"></div>

<section class="section-tight">
  <div class="container">
    <div class="section-head center">
      <span class="eyebrow">The Collection</span>
      <h1>Shop LE ROSÈA</h1>
      <p class="lede center">Dresses, gowns and co-ords, each hand-finished for the moments worth remembering.</p>
    </div>

    <div class="filter-bar">
      <div class="filter-group">
        <select id="filterCategory">
          <option value="">All Categories</option>
          <option value="Dresses">Dresses</option>
          <option value="Gowns">Gowns</option>
          <option value="Co-ords & Separates">Co-ords &amp; Separates</option>
          <option value="Top">Top</option>
          <option value="Skirt">Skirt</option>
        </select>
        <select id="filterColor">
          <option value="">All Colours</option>
        </select>
        <select id="filterSize">
          <option value="">All Sizes</option>
          <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
        </select>
        <select id="filterPrice">
          <option value="">All Prices</option>
          <option value="0-25000">Under ₹25,000</option>
          <option value="25000-45000">₹25,000 – ₹45,000</option>
          <option value="45000-65000">₹45,000 – ₹65,000</option>
          <option value="65000-999999">₹65,000 &amp; above</option>
        </select>
      </div>
      <span class="result-count" id="resultCount"></span>
    </div>

    <div class="product-grid" id="shopGrid"></div>
    <p id="emptyState" class="hidden center" style="padding:60px 0; color:var(--taupe);">No pieces match those filters just yet - try widening your search.</p>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/icons.js"></script>
<script src="js/products.js"></script>
<script src="js/placeholder-art.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/motion.js"></script>
<script>
  const params = new URLSearchParams(location.search);

  // Include every colour name — the single colorway for standard products, plus
  // each entry in colors[] for merged multi-colour products.
  function productColorNames(p){
    return (p.colors && p.colors.length) ? p.colors.map(c => c.name) : [p.colorway];
  }
  function populateColorOptions(){
    const set = new Set();
    PRODUCTS.forEach(p => { if (p.hidden) return; productColorNames(p).forEach(c => set.add(c)); });
    const colors = [...set].sort();
    const sel = document.getElementById('filterColor');
    colors.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  }

  function productCard(p){
    const badge = p.isNew ? '<span class="badge">New Arrival</span>' : '';
    return `<a class="product-card" href="product.html?id=${p.id}">
      ${productImageBlock(p, { inner: badge })}
      <div class="p-cat">${p.collection}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-price">${formatINR(p.price)}</div>
    </a>`;
  }

  function applyFilters(){
    const cat = document.getElementById('filterCategory').value;
    const color = document.getElementById('filterColor').value;
    const size = document.getElementById('filterSize').value;
    const priceRange = document.getElementById('filterPrice').value;

    let results = PRODUCTS.filter(p => {
      if (p.hidden) return false;
      if (cat && p.category !== cat && !(p.extraCategories || []).includes(cat)) return false;
      if (color && !productColorNames(p).includes(color)) return false;
      if (size && !p.sizes.includes(size)) return false;
      if (priceRange){
        const [min, max] = priceRange.split('-').map(Number);
        if (p.price < min || p.price > max) return false;
      }
      return true;
    });

    const grid = document.getElementById('shopGrid');
    const empty = document.getElementById('emptyState');
    grid.innerHTML = results.map(productCard).join('');
    empty.classList.toggle('hidden', results.length > 0);
    document.getElementById('resultCount').textContent = `${results.length} piece${results.length === 1 ? '' : 's'}`;
    initPlaceholderArt();
  }

  document.addEventListener('DOMContentLoaded', () => {
    populateColorOptions();
    if (params.get('category')) document.getElementById('filterCategory').value = params.get('category');
    ['filterCategory','filterColor','filterSize','filterPrice'].forEach(id =>
      document.getElementById(id).addEventListener('change', applyFilters)
    );
    applyFilters();
  });
</script>
</body>
</html>
