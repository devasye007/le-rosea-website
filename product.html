<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product - LE ROSÈA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-product">

<div id="site-header"></div>

<section class="section-tight">
  <div class="container" id="pdpRoot">
    <!-- populated by script -->
  </div>
</section>

<section class="section-tight" id="relatedSection">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">You May Also Love</span>
      <h2 class="mt-0">Complete the Moment</h2>
    </div>
    <div class="scroll-row" id="relatedRow"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/icons.js"></script>
<script src="js/products.js"></script>
<script src="js/placeholder-art.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/motion.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const product = getProductById(params.get('id')) || PRODUCTS[0];

  // Merged multi-colour products carry a colors[] array; single-colour products
  // fall back to their top-level colorway/images.
  const COLORS = (product.colors && product.colors.length) ? product.colors : null;

  // Selected colour comes from ?color= (case-insensitive), defaulting to the
  // first colour when absent or unrecognised.
  let selectedColor = null;
  if (COLORS){
    const wanted = (params.get('color') || '').trim().toLowerCase();
    const match = COLORS.find(c => c.name.toLowerCase() === wanted);
    selectedColor = (match || COLORS[0]).name;
  }

  let selectedSize = product.sizes[Math.floor(product.sizes.length/2)];
  let qty = 1;

  document.getElementById('pageTitle').textContent = `${product.name} - LE ROSÈA`;

  const EXPAND_ICON = `<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M4 15v5h5"/></svg>`;

  function currentColorObj(){
    if (!COLORS) return null;
    return COLORS.find(c => c.name === selectedColor) || COLORS[0];
  }
  function currentImages(){
    const c = currentColorObj();
    if (c) return (c.images && c.images.length) ? c.images : (product.images || []);
    return product.images || [];
  }
  function currentVideo(){
    const c = currentColorObj();
    if (c && c.video) return c.video;
    return product.video || null;
  }
  function currentMediaItems(){
    const imgs = currentImages();
    const items = imgs.map(src => ({ type: 'image', src: src }));
    const vid = currentVideo();
    if (!items.length){
      items.push({ type: 'art' });
    }
    if (vid){
      const poster = imgs.length ? imgs[0] : '';
      items.push({ type: 'video', src: vid, poster: poster });
    }
    return items;
  }
  function colorLabel(){
    return selectedColor || product.colorway;
  }

  // If a real photo fails to load, reveal the stage's fill instead of a broken-image icon.
  function pdpImgError(img){
    if (!img) return;
    img.style.visibility = 'hidden';
    const stage = img.closest('.pdp-stage');
    if (stage) stage.classList.add('img-failed');
  }

  function galleryMarkup(){
    const items = currentMediaItems();
    if (items.length){
      const alt = escapeHtml(product.name + ' - ' + colorLabel());
      const multi = items.length > 1;
      const arrows = multi ? `
          <button type="button" class="pdp-nav pdp-prev" id="pdpPrev" aria-label="Previous media">${ICONS.chevron}</button>
          <button type="button" class="pdp-nav pdp-next" id="pdpNext" aria-label="Next media">${ICONS.chevron}</button>` : '';
      const firstItem = items[0];
      const main = `<div class="pdp-gallery-main">
        <div class="pdp-stage" id="pdpStage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="${alt}">
          <img id="mainImg" class="pdp-main-img" src="${firstItem.type==='image'?assetPath(firstItem.src):''}" alt="${alt}" decoding="async" fetchpriority="high" onerror="pdpImgError(this)" style="${firstItem.type==='image'?'':'display:none;'}">
          <div id="mainArt" class="art tall pdp-main-img" data-art="${product.id}" data-art-variant="${product.artVariant}" data-art-label="${escapeHtml(colorLabel())}" style="${firstItem.type==='art'?'':'display:none;'}"></div>
          <video id="mainVideo" class="pdp-main-video" autoplay muted loop playsinline controls preload="metadata" style="${firstItem.type==='video'?'':'display:none;'}"${firstItem.poster ? ` poster="${assetPath(firstItem.poster)}"` : ''}>
            <source id="mainVideoSrc" src="${firstItem.type==='video'?assetPath(firstItem.src):''}" type="video/mp4">
          </video>
          ${arrows}
          <button type="button" class="pdp-expand" id="pdpExpand" aria-label="View full screen">${EXPAND_ICON}</button>
        </div>
      </div>`;
      const thumbs = multi ? `<div class="pdp-thumbs" id="pdpThumbs">${items.map((item, i) => {
        if (item.type === 'video'){
          const poster = item.poster || (items[0] && items[0].src) || '';
          return `<button type="button" class="pdp-thumb pdp-thumb-video ${i===0?'active':''}" data-index="${i}" aria-label="Play garment video"${i===0?' aria-current="true"':''}>
            ${poster ? `<img src="${assetPath(poster)}" alt="" loading="lazy" decoding="async">` : '<div style="width:100%;height:100%;background:#1b1612;"></div>'}
            <span class="pdp-thumb-play" aria-hidden="true">${ICONS.play}</span>
          </button>`;
        }
        if (item.type === 'art'){
          return `<button type="button" class="pdp-thumb ${i===0?'active':''}" data-index="${i}" aria-label="View garment preview"${i===0?' aria-current="true"':''}>
            <div class="art tall" style="width:100%;height:100%;" data-art="${product.id}" data-art-variant="${product.artVariant}"></div>
          </button>`;
        }
        return `<button type="button" class="pdp-thumb ${i===0?'active':''}" data-index="${i}" aria-label="View image ${i+1} of ${items.length}"${i===0?' aria-current="true"':''}>
          <img src="${assetPath(item.src)}" alt="" loading="lazy" decoding="async" onerror="this.closest('.pdp-thumb').style.display='none'">
        </button>`;
      }).join('')}</div>` : '';
      return main + thumbs;
    }
    return `<div class="pdp-gallery-main">
      <div class="art tall" id="mainArt" data-art="${product.id}" data-art-variant="${product.artVariant}" data-art-label="${escapeHtml(colorLabel())}"></div>
    </div>`;
  }

  // Small circular colour swatches (one per entry in colors[]). Only rendered
  // for merged multi-colour products; single-colour pieces keep a text label.
  function colourBlock(){
    if (COLORS){
      return `<div class="pdp-colors">
        <label class="pdp-colors-label">Colour: <strong id="pdpColorName">${escapeHtml(selectedColor)}</strong></label>
        <div class="swatch-row" id="swatchRow">
          ${COLORS.map(c => `<button type="button" class="color-swatch ${c.name===selectedColor?'selected':''}" data-color="${escapeHtml(c.name)}" style="--sw:${c.swatch}" aria-label="${escapeHtml(c.name)}" aria-pressed="${c.name===selectedColor}" title="${escapeHtml(c.name)}"></button>`).join('')}
        </div>
      </div>`;
    }
    return `<div>
      <label style="font-size:0.78rem; letter-spacing:0.06em; display:block; margin-bottom:8px;">Colourway: ${escapeHtml(product.colorway)}</label>
    </div>`;
  }

  function render(){
    const sizeOptions = product.sizes.concat(['Custom']);
    document.getElementById('pdpRoot').innerHTML = `
      <div class="pdp">
        <div>
          <div id="pdpGallery">${galleryMarkup()}</div>
        </div>
        <div class="pdp-info">
          <div class="p-cat">${product.category} · ${product.collection}</div>
          <h1>${product.name}</h1>
          <p class="p-price">${formatINR(product.price)}</p>

          ${colourBlock()}

          <p class="lede">${product.description}</p>

          <div class="spec-grid">
            <div><span>Craft</span><strong>${product.craft}</strong></div>
            <div><span>Made to order</span><strong>${product.madeToOrder ? 'Yes' : 'No'}</strong></div>
            <div><span>Lead time</span><strong>${product.leadTime}</strong></div>
            <div><span>Care</span><strong>${product.care}</strong></div>
          </div>

          <div>
            <label style="font-size:0.78rem; letter-spacing:0.06em; display:block; margin-bottom:8px;">Size</label>
            <div class="size-row" id="sizeRow">
              ${sizeOptions.map(s => `<div class="size-opt ${s===selectedSize?'selected':''}${s==='Custom'?' size-opt-custom':''}" data-size="${s}">${s}</div>`).join('')}
            </div>
            <a href="size-guide.html" class="text-link" style="font-size:0.74rem;">View size guide</a>
            <p class="model-note" id="modelNote">Model is wearing ${escapeHtml(product.modelSize)}.</p>

            <div class="custom-size hidden" id="customForm">
              <p class="custom-size-head">Enter your measurements (cm)</p>
              <div class="custom-grid">
                <div class="field"><label for="cmHeight">Height (cm)</label><input id="cmHeight" type="number" min="1" step="0.5" inputmode="decimal"></div>
                <div class="field"><label for="cmBust">Bust (cm)</label><input id="cmBust" type="number" min="1" step="0.5" inputmode="decimal"></div>
                <div class="field"><label for="cmWaist">Waist (cm)</label><input id="cmWaist" type="number" min="1" step="0.5" inputmode="decimal"></div>
                <div class="field"><label for="cmHip">Hip (cm)</label><input id="cmHip" type="number" min="1" step="0.5" inputmode="decimal"></div>
              </div>
              <p class="custom-hint hidden" id="customHint">Please enter all four measurements to continue.</p>
            </div>
          </div>

          <div style="margin-top:22px;">
            <label style="font-size:0.78rem; letter-spacing:0.06em; display:block; margin-bottom:8px;">Quantity</label>
            <div class="qty-row">
              <div class="qty-control">
                <button id="qtyMinus" aria-label="Decrease quantity">${ICONS.minus}</button>
                <span id="qtyValue">1</span>
                <button id="qtyPlus" aria-label="Increase quantity">${ICONS.plus}</button>
              </div>
            </div>
          </div>

          <div class="delivery-note">
            <span>&#9679;</span>
            <span>Made to order &middot; dispatched in ${product.leadTime}. ${product.customizable ? 'Customization available on this piece - see options below.' : ''}</span>
          </div>

          <div class="pdp-actions">
            <button class="btn btn-primary" id="addToCartBtn">Add to Bag</button>
            <button class="btn" id="buyNowBtn">Buy Now</button>
          </div>

          ${product.customizable ? `<a href="customization.html" class="text-link">Request a customization for this piece</a>` : ''}

          <div class="accordion" style="margin-top:34px;">
            <div class="accordion-item open">
              <button data-acc>Fabric &amp; Craftsmanship <span class="accordion-icon">+</span></button>
              <div class="accordion-body">
                <div class="accordion-body-inner">
                  <div class="fabric-specs">
                    <div class="fabric-spec-item"><span class="fabric-spec-label">Main fabric :</span> <span class="fabric-spec-val">${escapeHtml(product.mainFabric || product.fabric || '')}</span></div>
                    <div class="fabric-spec-item"><span class="fabric-spec-label">Lining :</span> <span class="fabric-spec-val">${escapeHtml(product.lining || 'Lycra')}</span></div>
                    <div class="fabric-spec-item"><span class="fabric-spec-label">Embroidery :</span> <span class="fabric-spec-val">${escapeHtml(product.embroidery || product.embellishment || '')}</span></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="accordion-item">
              <button data-acc>Fit &amp; Sizing <span class="accordion-icon">+</span></button>
              <div class="accordion-body"><div class="accordion-body-inner">${product.fit} Available in sizes ${product.sizes.join(', ')}, or choose Custom to order to your own measurements. If you're between sizes, we recommend sizing up for a relaxed drape.</div></div>
            </div>
            <div class="accordion-item">
              <button data-acc>Delivery &amp; Customization <span class="accordion-icon">+</span></button>
              <div class="accordion-body"><div class="accordion-body-inner">Dispatched within ${product.leadTime} of order confirmation. ${product.customizable ? 'This piece can be customized for measurements, length, colour or select design details - see our Customization page for the full process.' : 'This piece is available in standard sizing only.'}</div></div>
            </div>
            <div class="accordion-item">
              <button data-acc>Care <span class="accordion-icon">+</span></button>
              <div class="accordion-body"><div class="accordion-body-inner">${product.care}. Store on a padded hanger away from direct sunlight. Handcrafted embellishment may show slight natural variation - this is part of the character of the piece, not a flaw.</div></div>
            </div>
          </div>
        </div>
      </div>
    `;

    // Size selection (incl. the Custom option, which reveals the measurement form).
    const sizeRow = document.getElementById('sizeRow');
    sizeRow.querySelectorAll('.size-opt').forEach(el => el.addEventListener('click', () => {
      selectedSize = el.dataset.size;
      sizeRow.querySelectorAll('.size-opt').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      updateActions();
    }));

    // Live-validate the custom measurement inputs.
    ['cmHeight','cmBust','cmWaist','cmHip'].forEach(cid => {
      document.getElementById(cid)?.addEventListener('input', updateActions);
    });

    document.getElementById('qtyMinus').addEventListener('click', () => { qty = Math.max(1, qty-1); document.getElementById('qtyValue').textContent = qty; });
    document.getElementById('qtyPlus').addEventListener('click', () => { qty += 1; document.getElementById('qtyValue').textContent = qty; });

    document.getElementById('addToCartBtn').addEventListener('click', () => doAdd());
    document.getElementById('buyNowBtn').addEventListener('click', () => doAdd());

    document.querySelectorAll('[data-acc]').forEach(btn => btn.addEventListener('click', () => {
      const item = btn.closest('.accordion-item');
      const wasOpen = item.classList.contains('open');
      item.parentElement.querySelectorAll('.accordion-item').forEach(i => i.classList.remove('open'));
      if (!wasOpen) item.classList.add('open');
    }));

    // Colour swatches switch the whole gallery to the chosen colour's media.
    document.querySelectorAll('#swatchRow .color-swatch').forEach(btn => {
      btn.addEventListener('click', () => switchColor(btn.dataset.color));
    });

    mountGallery();
    updateActions();

    const related = PRODUCTS.filter(p => p.id !== product.id && p.category === product.category && !p.hidden).slice(0,6);
    document.getElementById('relatedRow').innerHTML = related.map(p => `
      <a class="product-card" href="product.html?id=${p.id}">
        ${productImageBlock(p)}
        <div class="p-cat">${p.collection}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-price">${formatINR(p.price)}</div>
      </a>`).join('');

    initPlaceholderArt();
  }

  // Switch the displayed colour: re-render swatches state, gallery and thumbs,
  // and keep the URL shareable via ?color=.
  function switchColor(name){
    if (!COLORS || name === selectedColor) return;
    const exists = COLORS.some(c => c.name === name);
    if (!exists) return;
    selectedColor = name;
    document.querySelectorAll('#swatchRow .color-swatch').forEach(b => {
      const on = b.dataset.color === name;
      b.classList.toggle('selected', on);
      b.setAttribute('aria-pressed', on);
    });
    const nameEl = document.getElementById('pdpColorName');
    if (nameEl) nameEl.textContent = name;
    document.getElementById('pdpGallery').innerHTML = galleryMarkup();
    mountGallery();
    initPlaceholderArt();
    try {
      const u = new URL(location.href);
      u.searchParams.set('color', name);
      history.replaceState(null, '', u);
    } catch(_){}
  }

  // ----- Custom-size validation -----
  function customValid(){
    if (selectedSize !== 'Custom') return true;
    return ['cmHeight','cmBust','cmWaist','cmHip'].every(cid => {
      const el = document.getElementById(cid);
      const v = el ? parseFloat(el.value) : NaN;
      return !isNaN(v) && v > 0;
    });
  }
  function getCustomMeasurements(){
    return {
      height: document.getElementById('cmHeight').value,
      bust: document.getElementById('cmBust').value,
      waist: document.getElementById('cmWaist').value,
      hip: document.getElementById('cmHip').value,
    };
  }
  function updateActions(){
    const custom = selectedSize === 'Custom';
    const form = document.getElementById('customForm');
    if (form) form.classList.toggle('hidden', !custom);
    const valid = customValid();
    const hint = document.getElementById('customHint');
    if (hint) hint.classList.toggle('hidden', !(custom && !valid));
    ['addToCartBtn','buyNowBtn'].forEach(bid => {
      const b = document.getElementById(bid);
      if (b) b.disabled = !valid;
    });
  }

  // Returns true when the item was added. addToCart opens the bag for review.
  function doAdd(){
    if (!customValid()){ updateActions(); return false; }
    const opts = {};
    if (COLORS) opts.color = selectedColor;
    if (selectedSize === 'Custom') opts.customMeasurements = getCustomMeasurements();
    addToCart(product.id, selectedSize, qty, opts);
    return true;
  }

  // Gallery: main-image swap, next/prev (wraparound), thumbnail sync,
  // keyboard nav, and a fullscreen lightbox. Idempotent - safe to re-run on
  // colour switch (any prior lightbox is removed first).
  function mountGallery(){
    document.getElementById('pdpLightbox')?.remove();
    const items = currentMediaItems();
    if (!items.length) return;
    const multi = items.length > 1;
    const mainImg = document.getElementById('mainImg');
    const mainArt = document.getElementById('mainArt');
    const mainVideo = document.getElementById('mainVideo');
    const mainVideoSrc = document.getElementById('mainVideoSrc');
    const stage = document.getElementById('pdpStage');
    const thumbEls = Array.from(document.querySelectorAll('.pdp-thumb'));
    let idx = 0;

    const alt = escapeHtml(product.name + ' - ' + colorLabel());
    const lb = document.createElement('div');
    lb.className = 'pdp-lightbox';
    lb.id = 'pdpLightbox';
    lb.tabIndex = -1;
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    lb.setAttribute('aria-label', product.name + ' media viewer');
    lb.setAttribute('aria-hidden', 'true');
    lb.innerHTML = `
      <button type="button" class="pdp-lb-close" aria-label="Close media viewer">${ICONS.close}</button>
      ${multi ? `<button type="button" class="pdp-lb-nav pdp-lb-prev" aria-label="Previous media">${ICONS.chevron}</button>` : ''}
      <img class="pdp-lb-img" id="pdpLbImg" alt="${alt}" style="display:none">
      <video class="pdp-lb-video" id="pdpLbVideo" autoplay muted loop playsinline controls style="display:none"></video>
      ${multi ? `<button type="button" class="pdp-lb-nav pdp-lb-next" aria-label="Next media">${ICONS.chevron}</button>` : ''}
      ${multi ? `<div class="pdp-lb-counter" id="pdpLbCounter" aria-hidden="true"></div>` : ''}`;
    document.body.appendChild(lb);
    const lbImg = lb.querySelector('#pdpLbImg');
    const lbVideo = lb.querySelector('#pdpLbVideo');
    const lbCounter = lb.querySelector('#pdpLbCounter');

    function show(i){
      idx = (i % items.length + items.length) % items.length;   // wraparound both directions
      const item = items[idx];

      if (item.type === 'video'){
        if (mainImg) mainImg.style.display = 'none';
        if (mainArt) mainArt.style.display = 'none';
        if (mainVideo){
          mainVideo.style.display = 'block';
          const vPath = assetPath(item.src);
          if (mainVideoSrc && mainVideoSrc.getAttribute('src') !== vPath){
            mainVideoSrc.src = vPath;
            mainVideo.load();
          }
          mainVideo.play().catch(function(){});
        }
      } else if (item.type === 'art'){
        if (mainVideo){ mainVideo.pause(); mainVideo.style.display = 'none'; }
        if (mainImg) mainImg.style.display = 'none';
        if (mainArt) mainArt.style.display = 'block';
      } else {
        if (mainVideo){ mainVideo.pause(); mainVideo.style.display = 'none'; }
        if (mainArt) mainArt.style.display = 'none';
        if (mainImg){
          mainImg.style.display = 'block';
          mainImg.style.visibility = '';
          mainImg.src = assetPath(item.src);
        }
      }

      if (lb.classList.contains('is-open')){
        updateLightbox();
      }

      thumbEls.forEach((t, ti) => {
        const on = ti === idx;
        t.classList.toggle('active', on);
        if (on) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current');
      });
      if (lbCounter) lbCounter.textContent = `${idx + 1} / ${items.length}`;
    }

    function updateLightbox(){
      const item = items[idx];
      if (item.type === 'video'){
        if (lbImg) lbImg.style.display = 'none';
        if (lbVideo){
          lbVideo.style.display = 'block';
          const vPath = assetPath(item.src);
          if (lbVideo.getAttribute('src') !== vPath){
            lbVideo.src = vPath;
            lbVideo.load();
          }
          lbVideo.play().catch(function(){});
        }
      } else if (item.type === 'image'){
        if (lbVideo){ lbVideo.pause(); lbVideo.style.display = 'none'; }
        if (lbImg){
          lbImg.style.display = 'block';
          lbImg.src = assetPath(item.src);
        }
      } else {
        if (lbVideo){ lbVideo.pause(); lbVideo.style.display = 'none'; }
        if (lbImg) lbImg.style.display = 'none';
      }
      if (lbCounter) lbCounter.textContent = `${idx + 1} / ${items.length}`;
    }

    const next = () => show(idx + 1);
    const prev = () => show(idx - 1);

    thumbEls.forEach(t => t.addEventListener('click', () => show(parseInt(t.dataset.index, 10))));
    document.getElementById('pdpPrev')?.addEventListener('click', e => { e.stopPropagation(); prev(); });
    document.getElementById('pdpNext')?.addEventListener('click', e => { e.stopPropagation(); next(); });

    stage?.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight'){ e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
      else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLb(); }
    });

    function openLb(){
      updateLightbox();
      lb.classList.add('is-open');
      lb.setAttribute('aria-hidden', 'false');
      document.body.classList.add('pdp-lb-open');
      lb.focus();
    }
    function closeLb(){
      if (lbVideo) lbVideo.pause();
      lb.classList.remove('is-open');
      lb.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('pdp-lb-open');
      stage?.focus();
    }

    document.getElementById('pdpExpand')?.addEventListener('click', e => { e.stopPropagation(); openLb(); });
    mainImg?.addEventListener('click', openLb);
    lb.querySelector('.pdp-lb-close')?.addEventListener('click', closeLb);
    lb.querySelector('.pdp-lb-prev')?.addEventListener('click', e => { e.stopPropagation(); prev(); });
    lb.querySelector('.pdp-lb-next')?.addEventListener('click', e => { e.stopPropagation(); next(); });
    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });   // click backdrop to close

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeLb();
      else if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft') prev();
    });

    show(0);
  }

  document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
