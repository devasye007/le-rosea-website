<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product - LE ROSÈA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-product">

<div id="site-header"></div>

<section class="section-tight">
  <div class="container" id="pdpRoot">
    <!-- populated by script -->
  </div>
</section>

<section class="section-tight" id="relatedSection">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">You May Also Love</span>
      <h2 class="mt-0">Complete the Moment</h2>
    </div>
    <div class="scroll-row" id="relatedRow"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/icons.js"></script>
<script src="js/products.js"></script>
<script src="js/placeholder-art.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/motion.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('id');
  const product = getProductById(id) || PRODUCTS[0];
  let selectedSize = product.sizes[Math.floor(product.sizes.length/2)];
  let qty = 1;

  document.getElementById('pageTitle').textContent = `${product.name} - LE ROSÈA`;

  const hasPhotos = product.images && product.images.length;

  const EXPAND_ICON = `<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M4 15v5h5"/></svg>`;

  // If a real photo fails to load, reveal the stage's fill instead of a broken-image icon.
  function pdpImgError(img){
    if (!img) return;
    img.style.visibility = 'hidden';
    const stage = img.closest('.pdp-stage');
    if (stage) stage.classList.add('img-failed');
  }

  function galleryMarkup(){
    if (hasPhotos){
      const alt = escapeHtml(product.name + ' — ' + product.colorway);
      const multi = product.images.length > 1;
      const arrows = multi ? `
          <button type="button" class="pdp-nav pdp-prev" id="pdpPrev" aria-label="Previous image">${ICONS.chevron}</button>
          <button type="button" class="pdp-nav pdp-next" id="pdpNext" aria-label="Next image">${ICONS.chevron}</button>` : '';
      const main = `<div class="pdp-gallery-main">
        <div class="pdp-stage" id="pdpStage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="${alt}">
          <img id="mainImg" class="pdp-main-img" src="${assetPath(product.images[0])}" alt="${alt}" decoding="async" fetchpriority="high" onerror="pdpImgError(this)">${arrows}
          <button type="button" class="pdp-expand" id="pdpExpand" aria-label="View full screen">${EXPAND_ICON}</button>
        </div>
      </div>`;
      const thumbs = multi ? `<div class="pdp-thumbs" id="pdpThumbs">${product.images.map((src,i) => `
        <button type="button" class="pdp-thumb ${i===0?'active':''}" data-index="${i}" aria-label="View image ${i+1} of ${product.images.length}"${i===0?' aria-current="true"':''}>
          <img src="${assetPath(src)}" alt="" loading="lazy" decoding="async" onerror="this.closest('.pdp-thumb').style.display='none'">
        </button>`).join('')}</div>` : '';
      return main + thumbs;
    }
    // No matched photos — a single generated placeholder, no gallery controls.
    return `<div class="pdp-gallery-main">
      <div class="art tall" id="mainArt" data-art="${product.id}" data-art-variant="${product.artVariant}" data-art-label="${escapeHtml(product.colorway)}"></div>
    </div>`;
  }

  function render(){
    document.getElementById('pdpRoot').innerHTML = `
      <div class="pdp">
        <div>
          ${galleryMarkup()}
        </div>
        <div class="pdp-info">
          <div class="p-cat">${product.category} · ${product.collection}</div>
          <h1>${product.name}</h1>
          <p class="p-price">${formatINR(product.price)}</p>
          <p class="lede">${product.description}</p>

          <div>
            <label style="font-size:0.78rem; letter-spacing:0.06em; display:block; margin-bottom:8px;">Colourway: ${product.colorway}</label>
          </div>

          <div class="spec-grid">
            <div><span>Craft</span><strong>${product.craft}</strong></div>
            <div><span>Made to order</span><strong>${product.madeToOrder ? 'Yes' : 'No'}</strong></div>
            <div><span>Lead time</span><strong>${product.leadTime}</strong></div>
            <div><span>Care</span><strong>${product.care}</strong></div>
          </div>

          <div>
            <label style="font-size:0.78rem; letter-spacing:0.06em; display:block; margin-bottom:8px;">Size</label>
            <div class="size-row" id="sizeRow"></div>
            <a href="size-guide.html" class="text-link" style="font-size:0.74rem;">View size guide</a>
          </div>

          <div style="margin-top:22px;">
            <label style="font-size:0.78rem; letter-spacing:0.06em; display:block; margin-bottom:8px;">Quantity</label>
            <div class="qty-row">
              <div class="qty-control">
                <button id="qtyMinus" aria-label="Decrease quantity">${ICONS.minus}</button>
                <span id="qtyValue">1</span>
                <button id="qtyPlus" aria-label="Increase quantity">${ICONS.plus}</button>
              </div>
            </div>
          </div>

          <div class="delivery-note">
            <span>&#9679;</span>
            <span>Made to order &middot; dispatched in ${product.leadTime}. ${product.customizable ? 'Customization available on this piece - see options below.' : ''}</span>
          </div>

          <div class="pdp-actions">
            <button class="btn btn-primary" id="addToCartBtn">Add to Bag</button>
            <button class="btn" id="buyNowBtn">Buy Now</button>
          </div>

          ${product.customizable ? `<a href="customization.html" class="text-link">Request a customization for this piece</a>` : ''}

          <div class="accordion" style="margin-top:34px;">
            <div class="accordion-item open">
              <button data-acc>Fabric &amp; Craftsmanship <span class="accordion-icon">+</span></button>
              <div class="accordion-body"><div class="accordion-body-inner">${product.fabric} ${product.embellishment}</div></div>
            </div>
            <div class="accordion-item">
              <button data-acc>Fit &amp; Sizing <span class="accordion-icon">+</span></button>
              <div class="accordion-body"><div class="accordion-body-inner">${product.fit} Available in sizes ${product.sizes.join(', ')}. If you're between sizes, we recommend sizing up for a relaxed drape.</div></div>
            </div>
            <div class="accordion-item">
              <button data-acc>Delivery &amp; Customization <span class="accordion-icon">+</span></button>
              <div class="accordion-body"><div class="accordion-body-inner">Dispatched within ${product.leadTime} of order confirmation. ${product.customizable ? 'This piece can be customized for measurements, length, colour or select design details - see our Customization page for the full process.' : 'This piece is available in standard sizing only.'}</div></div>
            </div>
            <div class="accordion-item">
              <button data-acc>Care <span class="accordion-icon">+</span></button>
              <div class="accordion-body"><div class="accordion-body-inner">${product.care}. Store on a padded hanger away from direct sunlight. Handcrafted embellishment may show slight natural variation - this is part of the character of the piece, not a flaw.</div></div>
            </div>
          </div>
        </div>
      </div>
    `;

    const sizeRow = document.getElementById('sizeRow');
    sizeRow.innerHTML = product.sizes.map(s => `<div class="size-opt ${s===selectedSize?'selected':''}" data-size="${s}">${s}</div>`).join('');
    sizeRow.querySelectorAll('.size-opt').forEach(el => el.addEventListener('click', () => {
      selectedSize = el.dataset.size;
      sizeRow.querySelectorAll('.size-opt').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    }));

    document.getElementById('qtyMinus').addEventListener('click', () => { qty = Math.max(1, qty-1); document.getElementById('qtyValue').textContent = qty; });
    document.getElementById('qtyPlus').addEventListener('click', () => { qty += 1; document.getElementById('qtyValue').textContent = qty; });

    document.getElementById('addToCartBtn').addEventListener('click', () => addToCart(product.id, selectedSize, qty));
    document.getElementById('buyNowBtn').addEventListener('click', () => { addToCart(product.id, selectedSize, qty); location.href = 'checkout.html'; });

    document.querySelectorAll('[data-acc]').forEach(btn => btn.addEventListener('click', () => {
      const item = btn.closest('.accordion-item');
      const wasOpen = item.classList.contains('open');
      item.parentElement.querySelectorAll('.accordion-item').forEach(i => i.classList.remove('open'));
      if (!wasOpen) item.classList.add('open');
    }));

    initGallery();

    const related = PRODUCTS.filter(p => p.id !== product.id && p.category === product.category).slice(0,6);
    document.getElementById('relatedRow').innerHTML = related.map(p => `
      <a class="product-card" href="product.html?id=${p.id}">
        ${productImageBlock(p)}
        <div class="p-cat">${p.collection}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-price">${formatINR(p.price)}</div>
      </a>`).join('');

    initPlaceholderArt();
  }

  // Gallery: main-image swap, next/prev (wraparound), thumbnail sync,
  // keyboard nav, and a fullscreen lightbox. Real photos only.
  function initGallery(){
    if (!hasPhotos) return;
    const imgs = product.images;
    const multi = imgs.length > 1;
    const mainImg = document.getElementById('mainImg');
    const stage = document.getElementById('pdpStage');
    const thumbEls = Array.from(document.querySelectorAll('.pdp-thumb'));
    let idx = 0;

    // Build the lightbox once and attach it to <body>.
    const alt = escapeHtml(product.name + ' — ' + product.colorway);
    const lb = document.createElement('div');
    lb.className = 'pdp-lightbox';
    lb.id = 'pdpLightbox';
    lb.tabIndex = -1;
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    lb.setAttribute('aria-label', product.name + ' image viewer');
    lb.setAttribute('aria-hidden', 'true');
    lb.innerHTML = `
      <button type="button" class="pdp-lb-close" aria-label="Close image viewer">${ICONS.close}</button>
      ${multi ? `<button type="button" class="pdp-lb-nav pdp-lb-prev" aria-label="Previous image">${ICONS.chevron}</button>` : ''}
      <img class="pdp-lb-img" id="pdpLbImg" alt="${alt}">
      ${multi ? `<button type="button" class="pdp-lb-nav pdp-lb-next" aria-label="Next image">${ICONS.chevron}</button>` : ''}
      ${multi ? `<div class="pdp-lb-counter" id="pdpLbCounter" aria-hidden="true"></div>` : ''}`;
    document.body.appendChild(lb);
    const lbImg = lb.querySelector('#pdpLbImg');
    const lbCounter = lb.querySelector('#pdpLbCounter');

    function show(i){
      idx = (i % imgs.length + imgs.length) % imgs.length;   // wraparound both directions
      const src = assetPath(imgs[idx]);
      if (mainImg){ mainImg.style.visibility = ''; mainImg.src = src; }
      if (lbImg) lbImg.src = src;
      thumbEls.forEach((t, ti) => {
        const on = ti === idx;
        t.classList.toggle('active', on);
        if (on) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current');
      });
      if (lbCounter) lbCounter.textContent = `${idx + 1} / ${imgs.length}`;
    }
    const next = () => show(idx + 1);
    const prev = () => show(idx - 1);

    thumbEls.forEach(t => t.addEventListener('click', () => show(parseInt(t.dataset.index, 10))));
    document.getElementById('pdpPrev')?.addEventListener('click', e => { e.stopPropagation(); prev(); });
    document.getElementById('pdpNext')?.addEventListener('click', e => { e.stopPropagation(); next(); });

    // Keyboard nav while the inline gallery is focused.
    stage?.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight'){ e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
      else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLb(); }
    });

    function openLb(){
      if (lbImg) lbImg.src = assetPath(imgs[idx]);
      if (lbCounter) lbCounter.textContent = `${idx + 1} / ${imgs.length}`;
      lb.classList.add('is-open');
      lb.setAttribute('aria-hidden', 'false');
      document.body.classList.add('pdp-lb-open');
      lb.focus();
    }
    function closeLb(){
      lb.classList.remove('is-open');
      lb.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('pdp-lb-open');
      stage?.focus();
    }

    document.getElementById('pdpExpand')?.addEventListener('click', e => { e.stopPropagation(); openLb(); });
    mainImg?.addEventListener('click', openLb);
    lb.querySelector('.pdp-lb-close')?.addEventListener('click', closeLb);
    lb.querySelector('.pdp-lb-prev')?.addEventListener('click', e => { e.stopPropagation(); prev(); });
    lb.querySelector('.pdp-lb-next')?.addEventListener('click', e => { e.stopPropagation(); next(); });
    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });   // click backdrop to close

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeLb();
      else if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft') prev();
    });

    show(0);
  }

  document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
